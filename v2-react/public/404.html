<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Visualised Engineering</title>
  <script>
    // The app uses hash routing (#/newsletter or #/radar), so GitHub Pages serves index.html.
    // Someone who types or shares a path-style URL lands here instead; redirect to the equivalent hash route.
    (function (l) {
      var match = l.pathname.match(/^(\/(?:AI-Engineering-Visualized|ai-engineering-visualized))/i);
      var repo = match ? match[1] : "/AI-Engineering-Visualized";
      var rest = match ? l.pathname.slice(match[1].length) : l.pathname;
      rest = rest.replace(/\/index\.html$/, "").replace(/\/+$/, "");
      var cleanPath = rest.indexOf("/") === 0 ? rest : "/" + rest;
      if (cleanPath === "/") cleanPath = "";
      var target = repo + "/#" + cleanPath + (l.search || "") + (l.hash || "");
      l.replace(target);
    })(window.location);
  </script>
</head>
<body></body>
</html>
