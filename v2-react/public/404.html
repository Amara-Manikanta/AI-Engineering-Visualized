<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Visualised Engineering</title>
  <script>
    // The app uses hash routing (#/newsletter), so GitHub Pages only ever
    // serves index.html. Someone who types or shares a path-style URL such as
    // /ai-engineering-visualized/newsletter?issue=1 lands here instead; send them to
    // the equivalent hash route rather than a dead page.
    (function (l) {
      var repo = "/ai-engineering-visualized";
      var hasRepo = l.pathname.indexOf(repo) === 0;
      var base = hasRepo ? repo : "";
      var path = hasRepo ? l.pathname.slice(repo.length) : l.pathname;
      path = path.replace(/\/index\.html$/, "").replace(/\/+$/, "");
      var cleanPath = path.indexOf("/") === 0 ? path : "/" + path;
      var target = base + "/#" + cleanPath + (l.search || "") + (l.hash || "");
      l.replace(target);
    })(window.location);
  </script>
</head>
<body></body>
</html>
