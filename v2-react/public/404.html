<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mani Notes</title>
  <script>
    // The app uses hash routing (#/rag/chunking), so GitHub Pages only ever
    // serves index.html. Someone who types or shares a path-style URL such as
    // /ai-engineering-visualized/rag/chunking lands here instead; send them to
    // the equivalent hash route rather than a dead page.
    (function (l) {
      var base = "/ai-engineering-visualized";
      var path = l.pathname.indexOf(base) === 0 ? l.pathname.slice(base.length) : l.pathname;
      path = path.replace(/\/index\.html$/, "").replace(/\/+$/, "");
      l.replace(base + "/#" + (path || "/") + (l.search || "") + (l.hash || ""));
    })(window.location);
  </script>
</head>
<body></body>
</html>
