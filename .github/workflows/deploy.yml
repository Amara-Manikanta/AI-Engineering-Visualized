name: Deploy React App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. Queued runs are skipped in favour of
# the latest, but an in-progress run is NEVER cancelled — killing a live
# production deploy mid-flight is what produced the "Deployment cancelled."
# failure. This matches GitHub's own Pages workflow template.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2-react/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./v2-react

      - name: Lint and content checks
        run: npx oxlint --deny-warnings && npm run check
        working-directory: ./v2-react

      - name: Build React App
        run: npm run build
        working-directory: ./v2-react

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./v2-react/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
